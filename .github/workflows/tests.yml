# haversack's test suite: every push, mlx-free by construction (tests/test_layering.py enforces
# that the package never imports it).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  haversack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # uv.lock is not the dependency source here (see below), so key the cache on the
          # workflow itself - it invalidates exactly when the installed set changes.
          cache-dependency-glob: .github/workflows/tests.yml
      - name: Install dependencies
        # Hand-listed rather than `uv sync` so torch can come from the CPU index: it avoids
        # pulling ~2.5 GB of CUDA wheels onto a CPU-only runner. src goes on the path.
        # The second line is the serve/REST tier (fastapi..matplotlib) plus modal + pydicom:
        # without them the serve suite importorskips to nothing and CI proves less than it
        # appears to (found when unguarded fastapi imports failed the 2026-08-25 push).
        run: |
          uv venv
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch nnunetv2 scipy scikit-image 'SimpleITK>=2.3' pytest \
            fastapi httpx python-multipart matplotlib modal pydicom 'zarr>=3'
      - name: Run tests
        env:
          PYTHONPATH: src
        # --no-project: plain `uv run` would re-sync the project and replace the CPU torch.
        run: uv run --no-project pytest -m "not slow" -q
