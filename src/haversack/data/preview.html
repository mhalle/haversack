<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ranked store preview</title>
<style>
  :root { color-scheme: dark; --bg: #111; --panel: #1b1b1b; --fg: #ddd; --dim: #888; --line: #333; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header input[type=text] { flex: 1 1 320px; min-width: 200px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 4px 6px; }
  button { background: #2a2a2a; color: var(--fg); border: 1px solid #444; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #333; }
  #status { color: var(--dim); flex-basis: 100%; min-height: 1.2em; }
  #status.error { color: #e88; }
  main { display: grid; grid-template-columns: 1fr 260px; gap: 12px; padding: 12px; }
  #panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-content: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 8px; }
  .panel h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
  .panel canvas { display: block; width: 100%; height: auto; background: #000; image-rendering: auto; }
  .panel input[type=range] { width: 100%; margin: 6px 0 0; }
  aside { background: var(--panel); border: 1px solid var(--line); padding: 8px; max-height: calc(100vh - 90px); overflow: auto; }
  aside h4 { margin: 8px 0 4px; font-size: 12px; color: var(--dim); }
  aside label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .tools label { display: inline-flex; }
  #drop.over { outline: 2px dashed #6a6; outline-offset: -6px; }
  footer { color: var(--dim); padding: 4px 12px 12px; font-size: 12px; }
  footer code { color: #aaa; }
</style>
</head>
<body id="drop">
<header>
  <input id="url" type="text" placeholder="URL of a ranked store: a .duckn directory or a .duckn.zip" spellcheck="false">
  <button id="open">Open</button>
  <label><button type="button" onclick="document.getElementById('file').click()">Open .duckn.zip file</button>
    <input id="file" type="file" accept=".zip" hidden></label>
  <div id="status">Open a store, or drop a .duckn.zip on the page.</div>
</header>
<main>
  <div id="panels"></div>
  <aside>
    <div class="tools">
      <button id="all">all</button><button id="none">none</button>
    </div>
    <label><input id="confidence" type="checkbox" checked> shade by confidence</label>
    <label><input id="outline" type="checkbox" checked> sub-voxel outline</label>
    <div id="legend"></div>
    <h4>store</h4>
    <div id="about" style="color:var(--dim)"></div>
  </aside>
</main>
<footer>Radiological display: patient left on the image right; sagittal viewed from the left. Fill = winning class, outline = the zero level of the margin field.</footer>
