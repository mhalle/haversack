[project]
name = "haversack"
version = "0.4.1"
description = "Medical-image segmentation models, many families behind one door: TotalSegmentator, MOOSE, MRSegmentator, stock nnU-Net and more, on MPS, CUDA or CPU, with a CLI and a local REST server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
    "typer>=0.12",
    # the wire's typed vocabulary (haversack.schemas): one declaration generates the
    # published JSON Schema, the submit-time validation and the OpenAPI document.
    # 27 ms to import, 7.8 MB on disk - noise next to SimpleITK's 183 MB, and it
    # is already present wherever `serve` is installed (FastAPI depends on it).
    "pydantic>=2",
    # SITK is core: reading/writing images and spacing-aware resampling are
    # part of segmenting, which is what the package is for. `uv run` installs it.
    "SimpleITK",
    # The inference stack is core (2026-09-03): a package whose point is running models
    # must run them after a bare install - `uvx git+.../haversack segment` is the first
    # thing a new user types, and it died on `import torch` while torch was an extra.
    # torch >= 2.7 for torch.mps.compile_shader; nnunetv2 for the network architecture,
    # weights and sliding-window slicers (stock APIs only); scipy builds the resampler's
    # exact operators; scikit-image is the test-only reference. numpy is left unpinned so
    # the synthstrip engine's numpy<2 fork still resolves beside core. A lean install
    # (client / describe-only, no torch) is `--no-deps` plus the first five names above -
    # see README "Lean install"; extras can only add.
    "torch>=2.7",
    "nnunetv2",
    "scipy",
    "scikit-image",
    # obstore is core (2026-09-03): `haversack segment idc:<uuid>` should work from a bare
    # install, and the IDC source is how the demo cases come in. A small Rust wheel, no
    # further dependencies.
    "obstore",
]
# NOTE: mlx is NOT a core dependency (moved to the `mlx` extra below, 2026-08-26).
# The product is torch/MPS-first (haversack); MLX is the oracle-only path. Keeping mlx
# in core made the whole package uninstallable where mlx has no wheels (Linux/CUDA/
# Modal) - CI had to avoid `uv sync` and hand-list deps for exactly this reason, and
# the per-engine images mount the package + hand-list rather than `pip install haversack[...]`.
# With mlx optional, core installs anywhere and uv-native `uv sync --extra <x>` works.

[project.scripts]
# haversack is the only executable. The MLX-era commands (nnmlx, TotalSegmentator, totalseg-mlx)
# are gone (2026-09-02): `uv tool install` put all four on PATH, three of them crashing
# without mlx and one shadowing a real TotalSegmentator.
haversack = "haversack.cli:main"

[project.optional-dependencies]
# There is no mlx extra. The MLX oracle haversack is checked against lives in its own
# repository, nnunet-inference-mlx; this package never imports it (tests/test_layering.py).
# Remote weight download (store.download / download_archive).
remote = ["httpx"]
# The REST job server (haversack serve).
serve = ["matplotlib", "fastapi", "uvicorn", "python-multipart"]
# Deploying the server to Modal (haversack modal deploy).
modal = ["modal"]
# Multi-label connected-component cleanup (segment --remove-small-components-mm3).
postprocessing = ["connected-components-3d"]
# The artifact-preview renderer. Every serve WORKER renders previews in the artifact
# overlap (serve-core render_preview imports matplotlib), so a worker image whose engine
# extra doesn't already bring matplotlib includes this. Kept out of an engine's own deps
# because it's a serve-tier concern, not the engine's.
preview = ["matplotlib"]
# CUDA-only acceleration for the nnU-Net worker: the Triton restore backend (picked
# automatically on CUDA). No macOS/Linux-CPU wheels, so it is opt-in - only the GPU base
# image syncs it. haversack falls back to the numpy/torch restore without it.
cuda = ["triton"]
test = ["pytest", "pydicom", "fastapi", "httpx", "python-multipart"]
# `[torch]` is an empty alias kept so that `haversack[torch]` in existing commands and docs
# still installs (the stack is core since 2026-09-03).
torch = []
# The SynthStrip engine: the model + conform live in the standalone `synthstrip-torch`
# package (like fastsurfer-lean; git rev in [tool.uv.sources]), which brings torch + surfa +
# numpy<2 + SimpleITK. scipy is haversack's (the post-restore mask cleanup). surfa's reorient
# needs numpy<2 - genuinely incompatible with the torch extra's numpy>=2, so this extra is
# declared conflicting below and uv forks them into ONE universal lock; materialize this engine
# on its own: `UV_PROJECT_ENVIRONMENT=.venvs/synthstrip uv sync --extra synthstrip`.
synthstrip = ["synthstrip-torch", "scipy"]
# The FastSurfer engine, installed pip-style from our slimmed fork `fastsurfer-lean`
# (mhalle/fastsurfer-lean - FastSurfer's parcellation CNN only, packaging fixed so
# FastSurferCNN's subpackages ship; git rev in [tool.uv.sources]). This replaces the
# image's git-clone + requirements + sys.path hack with a proper install. Upstream
# FastSurfer itself can't be an extra: its `[tool.setuptools] packages` list omits
# subpackages, so a plain `pip install git+.../FastSurfer` is import-broken - hence
# the fork. Heavy tree dropped in the fork; conflicts with the other engines below.
fastsurfer = ["fastsurfer-lean"]
# The VoxTell engine (haversack.engines.voxtell): free-text promptable segmentation from
# MIC-DKFZ. Its own environment because it pins `torch>=2.0,<2.9` while the torch extra
# is unbounded (and resolves well past that) - declared conflicting below. The package
# brings its own tree (nnunetv2, dynamic-network-architectures, transformers,
# huggingface_hub); weights + the precomputed text-embedding bank come from the HF hub.
voxtell = ["voxtell"]
# The MONAI engine: a CATALOG of model-zoo bundles, not one model. `monai` brings the
# runtime; the rest is the union of the curated bundles' own required_packages_version
# (tools/gen_monai_manifest.py prints it), because a bundle carries its own transform
# chain and therefore its own deps. Conflicting with the other engines below, as ever.
monai = ["monai>=1.4", "torch>=2.7", "nibabel", "itk", "pytorch-ignite", "einops",
         "timm", "scikit-learn", "tensorboard", "fire", "PyYAML"]
# INTERNAL, undocumented: duckn volumes as input and ranked stores (zarr, duckn metadata) as
# output - haversack.duckn_io, haversack.ranked_store, haversack.ranked_output. duckn is not
# on PyPI; it installs from its GitHub tag (git source below). Not a conflict group: it sits
# beside the torch extra. The dev env adds it: `uv sync --extra torch ... --extra duckn`.
# Both need Python 3.12 (zarr 3.3 and duckn set that floor); below it the extra is empty
# rather than pulling haversack's own floor up for an internal feature.
duckn = ["duckn; python_version >= '3.12'", "zarr>=3.3; python_version >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haversack"]
# The task catalogs ship whatever .gitignore says: hatch skips VCS-ignored files, and a
# `data/` rule in the workspace .gitignore once swallowed src/haversack/data - a wheel built from
# the pushed branch had no catalog, and every `haversack segment` died on a missing
# ts_tasks.json (2026-09-02). `artifacts` (not force-include, which would add the files a
# second time now that they are tracked) makes them part of the normal selection.
artifacts = ["src/haversack/data/*.json", "src/haversack/data/*.md", "src/haversack/data/*.html"]

[tool.hatch.build.targets.wheel.force-include]
# The README is the user guide, and `haversack docs` prints it from inside the wheel; an
# editable checkout reads the repository's README instead (cli.user_guide) - one source.
"README.md" = "haversack/data/GUIDE.md"
# The server guide, the same way: `haversack docs --server`, and the server's own OpenAPI
# description is drawn from it.
"SERVER.md" = "haversack/data/SERVER.md"

[tool.uv]
# Engines own their environments (docs: "one environment per engine") when their deps
# genuinely conflict (synthstrip's numpy<2; voxtell's torch<2.9 against core's); those are
# declared here so uv resolves them in separate forks of ONE universal lock. fastsurfer left
# the group 2026-09-03: the fork's torch pin was upstream's CUDA-11 caution, relaxed, and the
# engine now installs into the main environment (`uv sync --extra fastsurfer`) -
# the same declaration then drives per-engine venvs locally and per-engine images on Modal.
# A future engine with its own incompatible pins adds an extra + one entry here.
conflicts = [
    [
      { extra = "synthstrip" },
      { extra = "voxtell" },
      { extra = "monai" },
    ],
    # duckn's zarr needs numpy>=2; synthstrip's surfa needs numpy<2. Everything else in the
    # main environment already sits on numpy 2, so this only says what was already true.
    [
      { extra = "duckn" },
      { extra = "synthstrip" },
    ],
]

[tool.uv.sources]
# nnunetv2 comes from PyPI: haversack uses only stock nnunetv2 APIs (verified against 2.8.1). It
# used to be a `path = "../upstream/nnUNet"` source here, but uv applies these sources to a
# `git+https://...` install too, and that relative path exists only in the dev workspace - so
# every outside install failed before downloading anything (2026-09-02). For upstream work
# put the checkout in by hand: `uv pip install -e ../upstream/nnUNet`.
# fastsurfer-lean = our slimmed FastSurfer fork (parcellation CNN only, packaging fixed).
# Pinned to the slim branch's rev; import namespace stays FastSurferCNN.
fastsurfer-lean = { git = "https://github.com/mhalle/fastsurfer-lean.git", rev = "68322213c0c9ff2b6b1612aa5bd9b7272cc6a817" }
# voxtell = MIC-DKFZ's free-text promptable segmentation. Pinned to a git rev, not the
# PyPI release: 0.1.0 on PyPI predates helpers this engine uses (download_voxtell_model),
# and pinning the rev means the source we integrated against is the source that runs.
voxtell = { git = "https://github.com/MIC-DKFZ/VoxTell.git", rev = "8ef0332aec5d5dff925d6f6370386c00334b57ab" }
# duckn = the metadata standard the ranked stores are written in (seg extension 0.7 as of
# 0.3.0). A release tag, not a branch, so a sync is reproducible; to work on duckn itself,
# `uv pip install -e ../duckn` after the sync puts the sibling checkout in front of it.
duckn = { git = "https://github.com/mhalle/duckn.git", tag = "v0.3.2" }
# synthstrip-torch = our standalone SynthStrip inference package (StripModel + surfa conform
# + SDT; weights fetched from MGH at runtime). Import namespace: synthstrip_torch.
synthstrip-torch = { git = "https://github.com/mhalle/synthstrip-torch.git", rev = "1b871fb1f98fbe60ed1efe87de34a8703a106b44" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy benchmarks (deselect with '-m not slow')"]
